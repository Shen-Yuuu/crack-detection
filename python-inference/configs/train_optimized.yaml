# 优化后的裂纹检测训练配置
# 解决了NaN问题，增强了训练稳定性

# 数据集配置
dataset:
  root: "../data/processed"
  image_dir: "images"
  mask_dir: "masks"
  crop_size: [512, 512]
  train_scales: [[448, 448], [512, 512], [576, 576]]
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]
  use_cache: false
  cache_dir: "./cache"
  min_mask_ratio: 0.001
  # 降低MixUp/CutMix概率以提高稳定性
  mixup_prob: 0.15
  cutmix_prob: 0.20
  mix_alpha: 0.4
  focus_crop_prob: 0.5
  hard_mining_update_interval: 256

# 模型配置
model:
  backbone: "convnext_small"
  pretrained: "../convnext_small.bin"
  num_classes: 1
  decoder_channels: 256  # 降低以提高稳定性
  deep_supervision: true  # 已修复NaN问题
  edge_branch: true
  head_dropout: 0.2
  drop_path_rate: 0.1  # DropPath正则化率

# 损失函数配置
loss:
  type: "combined"
  dice: 0.4
  focal: 0.3
  bce: 0.2
  boundary: 0.1
  focal_gamma: 2.0
  use_tversky: true
  tversky_beta: 0.6

# 优化器配置
optimizer:
  type: "adamw"
  lr: 0.0005  # 降低初始学习率
  weight_decay: 0.0001

# 学习率调度器配置
scheduler:
  type: "cosine_warmup"
  warmup_epochs: 10
  warmup_start_factor: 0.1
  min_lr: 0.00001

# 训练配置
training:
  epochs: 300
  batch_size: 4
  num_workers: 4
  output_dir: "./outputs"
  
  use_amp: true
  use_ema: true
  ema_decay: 0.9995
  use_swa: true
  swa_start_epoch: 200
  
  gradient_accumulation_steps: 2
  max_grad_norm: 0.5  # 更严格的梯度裁剪
  
  early_stopping_patience: 25

# 推理配置
inference:
  sliding_window:
    enabled: true
    window_size: [1024, 1024]
    overlap: 0.25
    batch_size: 4
    blend_mode: "gaussian"
  
  tta:
    enabled: true
    scales: [0.75, 1.0, 1.25]
    flip_h: true
    flip_v: true
  
  postprocess:
    threshold: 0.5
    min_area: 50
    morphology:
      enabled: true
      kernel_size: 3
      operations: ["open", "close"]

# 评估配置
evaluation:
  metrics: ["iou", "dice", "precision", "recall", "f1"]
  boundary_metrics:
    enabled: true
    tolerance: 2

# 日志配置
logging:
  log_interval: 50
  save_checkpoint_interval: 5
  tensorboard: true
  wandb:
    enabled: false
    project: "crack-detection"

# 硬件配置
hardware:
  gpu_ids: [0]
  distributed: false
  num_gpus: 1

seed: 42
