server:
  port: 8081

spring:
  application:
    name: cloud-auth
  
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/crack_detection?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: crack_user
    password: crack_password123
  
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  
  rabbitmq:
    host: localhost
    port: 5672
    username: crack_user
    password: crack_password123

# JWT配置
jwt:
  secret: crack-detection-system-secret-key-2024-very-long-secret-key-must-be-at-least-256-bits
  access-token-expiration: 3600
  refresh-token-expiration: 604800

# MinIO配置
minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin123
  bucket-name: crack-detection

# MyBatis Plus配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Knife4j配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 认证服务
      paths-to-match: /**
      packages-to-scan: com.crack.auth.controller

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.crack: debug
